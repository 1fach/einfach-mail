[package]
name = "einfach-mail-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "einfach-mail"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
einfach-mail-application = { path = "../../crates/application" }
einfach-mail-domain = { path = "../../crates/domain" }
einfach-mail-persistence = { path = "../../crates/persistence" }
einfach-mail-microsoft-graph = { path = "../../crates/providers/microsoft-graph" }
jiff.workspace = true
time.workspace = true
uuid.workspace = true
tokio.workspace = true
xdg.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false, features = ["test-support"] }

[lints]
workspace = true
