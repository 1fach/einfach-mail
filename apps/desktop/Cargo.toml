[package]
name = "einfach-mail-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobins = false

[features]
ui-preview = []

[[bin]]
name = "einfach-mail"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
gpui-kit.workspace = true
einfach-mail-application = { path = "../../crates/application" }
einfach-mail-account-router = { path = "../../crates/providers/account-router" }
einfach-mail-domain = { path = "../../crates/domain" }
einfach-mail-exchange-ews = { path = "../../crates/providers/exchange-ews" }
einfach-mail-persistence = { path = "../../crates/persistence" }
einfach-mail-microsoft-graph = { path = "../../crates/providers/microsoft-graph" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time.workspace = true
uuid.workspace = true
tokio.workspace = true
xdg.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
