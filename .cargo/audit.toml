# SSPI 0.23.1 pins rsa 0.10.0-rc.18, which RustSec still marks vulnerable.
# This app uses only SSPI's NTLM provider and has no RSA private-key operation.
# Remove the exception when the dependency updates; see issue #259.
# RUSTSEC-2026-0459 requires opening an attacker-written database/WAL pair.
# The app opens only its own cache in an owner-only directory and has no import path.
# Upgrade the bundled SQLCipher source when available; see issue #262.
[advisories]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]
