name: Set up vendored OpenSSL tools on Windows
description: Install Strawberry Perl with Text::Template and NASM for vendored OpenSSL builds.
runs:
  using: composite
  steps:
    - uses: shogo82148/actions-setup-perl@v1.44.2
      with:
        perl-version: "5.42"
        distribution: strawberry
        install-modules-with: cpanm
        install-modules: Text::Template

    - uses: ilammy/setup-nasm@v1.5.2
      with:
        version: 2.16.01
