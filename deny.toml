# Enforce the separate message-renderer decision in ADR 0007.
# Wry and gpui-webview remain banned until a body-only WebView passes that review.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "wry", reason = "Browser rendering is not part of the native app; see ADR 0007 for the body-only renderer gate." },
    { crate = "gpui-webview", reason = "ADR 0007 defers this optional WebView pending a separate security decision." },
]
