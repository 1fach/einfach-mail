[rules]
einfach-mail-domain = []
einfach-mail-application = ["einfach-mail-domain", "tokio-util"]
einfach-mail-persistence = ["einfach-mail-application", "einfach-mail-domain"]
einfach-mail-microsoft-graph = ["einfach-mail-application", "einfach-mail-domain", "einfach-mail-provider-runtime"]
einfach-mail-exchange-ews = ["einfach-mail-application", "einfach-mail-domain", "einfach-mail-provider-runtime"]
einfach-mail-account-router = ["einfach-mail-application", "einfach-mail-domain", "einfach-mail-exchange-ews", "einfach-mail-microsoft-graph"]
einfach-mail-provider-runtime = ["einfach-mail-application"]
einfach-mail-desktop = ["einfach-mail-account-router", "einfach-mail-application", "einfach-mail-domain", "einfach-mail-exchange-ews", "einfach-mail-microsoft-graph", "einfach-mail-persistence"]

[options]
strict = true
check_dev_deps = true
unmatched_config_entries = "error"
