[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/application",
    "crates/domain",
    "crates/persistence",
    "crates/providers/microsoft-graph",
    "crates/providers/exchange-ews",
    "crates/providers/account-router",
    "crates/providers/runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
gpui-kit = "0.9.1"
addr-spec = "0.10.4"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
async-sqlite = { version = "0.7.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
blocking = "1.7.0"
thiserror = "2.0.21"
enumset = "1.1.15"
hex = "0.4.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
httpmock = { version = "0.9.0", default-features = false, features = ["https"] }
httpdate = "1.0.3"
headers = "0.4.2"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
windows-timezones = { version = "0.5.1", default-features = false, features = ["std"] }
getrandom = "0.4.3"
html2text = "0.17.4"
huskarl = { version = "0.11.10", default-features = false, features = ["authorization-flow-loopback"] }
huskarl-reqwest = { version = "0.9.3", default-features = false, features = ["rustls-tls"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "system-proxy"] }
ews = "0.1.2"
quick-xml = "0.42.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = "0.10.3"
sspi = { version = "0.23.1", default-features = false }
smol = "2.0.2"
rusqlite_migration = "2.7.0"
sha2 = "0.11.1"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "std"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
x509-parser = { version = "0.18.1", default-features = false }
uuid = { version = "1.29.0", default-features = false, features = ["std", "v4"] }
webbrowser = { version = "1.2.6", default-features = false, features = ["hardened"] }
xdg = "3.0.0"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/LucaCappelletti94/rusqlite.git", rev = "0f1ab7393ae5d62d44a94a5a5107c00b23d4ed58" }
