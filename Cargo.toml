[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/application",
    "crates/domain",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
gpui-kit = "0.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
