[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/application",
    "crates/domain",
    "tools/message-body-proof",
    "tools/storage-proof",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
gpui-kit = "0.8.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
