[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/application",
    "crates/domain",
    "crates/persistence",
    "crates/providers/microsoft-graph",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
gpui-kit = "0.8.1"
addr-spec = "0.10.4"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
async-sqlite = { version = "0.6.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
blocking = "1.7.0"
thiserror = "2.0.21"
hex = "0.4.3"
httpmock = { version = "0.9.0", default-features = false }
httpdate = "1.0.3"
headers = "0.4.2"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
getrandom = "0.4.3"
html2text = "0.17.4"
huskarl = { version = "0.11.10", default-features = false, features = ["authorization-flow-loopback"] }
huskarl-reqwest = { version = "0.9.3", default-features = false, features = ["rustls-tls"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0.2"
rusqlite_migration = "2.6.0"
sha2 = "0.11.1"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "std"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
uuid = { version = "1.29.0", default-features = false, features = ["std", "v4"] }
webbrowser = { version = "1.2.6", default-features = false, features = ["hardened"] }
xdg = "3.0.0"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[patch.crates-io]
# Expose the styled DatePicker's inner ComboBox name; see ADR 0050.
gpui-component = { path = "vendor/gpui-component" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
