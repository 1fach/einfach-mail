[package]
name = "einfach-mail-graph-transport-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Test-only proof for the Microsoft Graph HTTP transport boundary"

[dev-dependencies]
async-channel = "2.5.0"
httpdate = "1.0.3"
httpmock = { version = "0.9.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0.2"
tokio = { version = "1.0", features = ["macros", "net", "rt", "time"] }

[lints]
workspace = true
