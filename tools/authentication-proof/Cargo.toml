[package]
name = "einfach-mail-auth-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Test-only proof for delegated Entra authentication dependencies"

[dev-dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
huskarl = { version = "0.11.10", default-features = false, features = ["authorization-flow-loopback"] }
huskarl-reqwest = { version = "0.9.3", default-features = false, features = ["rustls-tls"] }
http = "1.3.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.52.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5.8"

[lints]
workspace = true
