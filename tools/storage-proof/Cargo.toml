[package]
name = "einfach-mail-storage-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Test-only proof for encrypted SQLite and Linux credential storage"

[dev-dependencies]
async-sqlite = { version = "0.6.0", default-features = false, features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite_migration = "2.6.0"
smol = "2.0.2"
tempfile = "3.27.0"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[lints]
workspace = true
